[project]
name = "chiori"
version = "0.11.2"
description = "Multi-functional modular discord bot for fluffy our server"
readme = "README.md"
requires-python = ">=3.12,<4.0"
license = "GPL-3.0-or-later"
dependencies = [
    "aiodns>=4.0.0",
    "aiohttp>=3.12.14",
    "asyncpg>=0.30.0",
    "asyncpg-stubs>=0.30.2",
    "hikari>=2.3.3",
    "hikari-arc>=2.1.1",
    "hikari-miru>=4.2.0",
    "loguru>=0.7.3",
    "orjson>=3.11.9",
    "pydantic-settings>=2.9.1",
    "toml>=0.10.2",
]

[dependency-groups]
dev = [
    "nox>=2026.4.10",
    "pyright>=1.1.403",
    "ruff>=0.15.11",
]

[tool.uv.sources]
hikari-ongaku = { git = "https://github.com/pentergust/ongaku" }

[tool.mypy]
ignore_errors = true # I use pyright only because mypy dumb

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
reportPrivateUsage = false
reportMissingTypeStubs = true
reportUnnecessaryTypeIgnoreComment = "warning"
reportUninitializedInstanceVariable = "error"

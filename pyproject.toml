[project]
name = "chiori"
version = "0.11.0"
description = "Multi-functional modular discord bot for your fluffy server"
readme = "README.md"
requires-python = ">=3.12,<4.0"
license = "GPL-3.0-or-later"
dependencies = [
    "asyncpg>=0.30.0",
    "asyncpg-stubs>=0.30.2",
    "hikari>=2.3.3",
    "hikari-arc>=2.1.1",
    "hikari-miru>=4.2.0",
    "loguru>=0.7.3",
    "pydantic-settings>=2.9.1",
    "toml>=0.10.2",
]

[dependency-groups]
dev = ["pyright>=1.1.403", "ruff>=0.15.11"]
